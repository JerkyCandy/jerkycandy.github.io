<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOURVIVE Sign-In</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0c14;
      color: #eef2ff;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <p id="msg">Returning to FOURVIVE...</p>
  <script>
    (function () {
      var appBase = "com.jerkycandy.fourvive://google/oauth/callback";
      var hash = window.location.hash || "";
      var search = window.location.search || "";
      var tail = hash || (search ? ("#" + search.substring(1)) : "");
      try {
        window.location.replace(appBase + tail);
      } catch (e) { }
      setTimeout(function () {
        var el = document.getElementById("msg");
        if (el) {
          el.textContent = "Open the FOURVIVE app to continue sign-in.";
        }
      }, 2500);
    })();
  </script>
</body>
</html>
